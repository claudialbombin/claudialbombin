name: Refresh profile

# Rebuilds every generated image in the profile from live GitHub data:
#   - assets/generated/*        stats, languages, recent activity, project cards
#   - profile-3d-contrib/*      3D contribution calendar
# Runs daily, on demand, and whenever the generator or its config changes.

on:
  schedule:
    - cron: "23 5 * * *"        # 05:23 UTC daily (06:23 / 07:23 in Madrid)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats, languages, activity and project cards
        run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile images"
            git push
          fi
