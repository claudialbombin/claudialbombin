<svg width="480" height="260" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages">
  <defs>
    <clipPath id="r"><rect width="480" height="260" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="480" height="260" fill="#0d1117"/>
    <rect width="480" height="260" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="24" y="30" font-family="Segoe UI, Verdana, sans-serif" font-size="16" font-weight="700" fill="#58a6ff">Most Used Languages</text>
    
    <g transform="translate(24,66)">
      <text x="0" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#c9d9ec">Python</text>
      <rect x="140" y="4" width="252" height="10" rx="5" fill="#1c2b3f"/>
      <rect x="140" y="4" width="0" height="10" rx="5" fill="#3776AB">
        <animate attributeName="width" from="0" to="144.3" dur="1.1s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="402" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#8b98a5">57.3%</text>
    </g>
    <g transform="translate(24,103)">
      <text x="0" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#c9d9ec">C</text>
      <rect x="140" y="4" width="252" height="10" rx="5" fill="#1c2b3f"/>
      <rect x="140" y="4" width="0" height="10" rx="5" fill="#00599C">
        <animate attributeName="width" from="0" to="49.7" dur="1.1s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="402" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#8b98a5">19.7%</text>
    </g>
    <g transform="translate(24,140)">
      <text x="0" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#c9d9ec">HTML</text>
      <rect x="140" y="4" width="252" height="10" rx="5" fill="#1c2b3f"/>
      <rect x="140" y="4" width="0" height="10" rx="5" fill="#E34C26">
        <animate attributeName="width" from="0" to="34.4" dur="1.1s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="402" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#8b98a5">13.7%</text>
    </g>
    <g transform="translate(24,177)">
      <text x="0" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#c9d9ec">Jupyter Notebook</text>
      <rect x="140" y="4" width="252" height="10" rx="5" fill="#1c2b3f"/>
      <rect x="140" y="4" width="0" height="10" rx="5" fill="#F37626">
        <animate attributeName="width" from="0" to="17.1" dur="1.1s" begin="0.36s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="402" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#8b98a5">6.8%</text>
    </g>
    <g transform="translate(24,214)">
      <text x="0" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="13" fill="#c9d9ec">Shell / TeX / SQL</text>
      <rect x="140" y="4" width="252" height="10" rx="5" fill="#1c2b3f"/>
      <rect x="140" y="4" width="0" height="10" rx="5" fill="#89E051">
        <animate attributeName="width" from="0" to="6.5" dur="1.1s" begin="0.48s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="402" y="14" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#8b98a5">2.6%</text>
    </g>
    <text x="24" y="248" font-family="Segoe UI, Verdana, sans-serif" font-size="10" fill="#586069">by lines of source code across public repos (notebook outputs excluded)</text>
  </g>
</svg>
