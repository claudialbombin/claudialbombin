<svg width="480" height="120" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile stats">
  <defs><clipPath id="r"><rect width="480" height="120" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="480" height="120" fill="#0d1117"/>
    <rect width="480" height="120" fill="none" stroke="#30363d" stroke-width="1"/>
    
    <g transform="translate(0.0,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/>
      <text x="60.0" y="46" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="28" font-weight="700" fill="#58a6ff">13</text>
      <text x="60.0" y="66" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#c9d9ec"><tspan x="60.0" dy="0">Public</tspan><tspan x="60.0" dy="14">repos</tspan></text>
    </g>
    <g transform="translate(120.0,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.15s" fill="freeze"/>
      <text x="60.0" y="46" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="28" font-weight="700" fill="#58a6ff">5</text>
      <text x="60.0" y="66" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#c9d9ec"><tspan x="60.0" dy="0">Quant / sim</tspan><tspan x="60.0" dy="14">projects</tspan></text>
    </g><line x1="120.0" y1="20" x2="120.0" y2="100" stroke="#30363d" stroke-width="1"/>
    <g transform="translate(240.0,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.30s" fill="freeze"/>
      <text x="60.0" y="46" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="28" font-weight="700" fill="#58a6ff">3</text>
      <text x="60.0" y="66" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#c9d9ec"><tspan x="60.0" dy="0">Python + C</tspan><tspan x="60.0" dy="14">repos</tspan></text>
    </g><line x1="240.0" y1="20" x2="240.0" y2="100" stroke="#30363d" stroke-width="1"/>
    <g transform="translate(360.0,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
      <text x="60.0" y="46" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="28" font-weight="700" fill="#58a6ff">2</text>
      <text x="60.0" y="66" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#c9d9ec"><tspan x="60.0" dy="0">Years @</tspan><tspan x="60.0" dy="14">ICAI</tspan></text>
    </g><line x1="360.0" y1="20" x2="360.0" y2="100" stroke="#30363d" stroke-width="1"/>
  </g>
</svg>
